    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);

}

    margin-top:0;

}

<body>

<!-- TOP HEADER -->

<div class="top-header">

    <img src="new.png" alt="Latest Rojgar Logo" class="logo">

    <h1 class="site-title">Latest Rojgar</h1>

    <p class="site-tagline">
        India's Trusted Sarkari Job Portal

<!-- NAVBAR -->

    <a href="answer-key.html">Answer Key</a>
    <a href="sarkari-yojana.html">Sarkari Yojana</a>
</nav>

<!-- PAGE HEADER -->

<div class="page-header">
    <h1>Latest Government Jobs 2026</h1>
    <p>Check all latest Sarkari Naukri notifications here.</p>
</div>

<!-- SEARCH BOX -->

<div class="search-box">
    <input type="text" placeholder="Search Latest Jobs...">
</div>

<!-- JOB LIST -->

<div class="jobs-container" id="jobsContainer">
  <p id="jobsStatus" style="text-align:center;color:#64748b;">Loading latest jobs...</p>
</div>

<script>
let latestJobData = [];
const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, m => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));

function renderLatestJobs(list){
  const container = document.getElementById("jobsContainer");
  if(!list.length){
    container.innerHTML = '<p style="text-align:center;color:#64748b;">No published jobs yet.</p>';
    return;
  }
  container.innerHTML = list.map(job => `
    <div class="job-card">
      <h2>${escapeHtml(job.title)}</h2>
      <div class="job-info"><strong>Organization:</strong> ${escapeHtml(job.department || "-")}</div>
      <div class="job-info"><strong>Total Posts:</strong> ${escapeHtml(job.total_posts ?? "-")}</div>
      <div class="job-info"><strong>Last Date:</strong> ${escapeHtml(job.application_end || "-")}</div>
      <div class="job-info">${escapeHtml(job.qualification || "")}</div>
      <a href="/jobs/${encodeURIComponent(job.slug)}" class="apply-btn">View Full Details</a>
    </div>
  `).join("");
}

fetch("/api/jobs?limit=100")
  .then(r => {
    if(!r.ok) throw new Error("Unable to load jobs");
    return r.json();
  })
  .then(data => {
    latestJobData = data || [];
    renderLatestJobs(latestJobData);
  })
  .catch(err => {
    document.getElementById("jobsContainer").innerHTML =
      '<p style="text-align:center;color:#b91c1c;">' + escapeHtml(err.message) + '</p>';
  });

const searchInput = document.querySelector(".search-box input");
if(searchInput){
  searchInput.addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    renderLatestJobs(latestJobData.filter(job =>
      [job.title, job.department, job.category, job.qualification]
        .join(" ").toLowerCase().includes(q)
    ));
  });
}
</script>

<!-- FOOTER -->

<footer class="footer">
    <p>© 2026 Latest Rojgar | All Rights Reserved</p>
</footer>

</body>
